# Render 블루프린트 — Render 대시보드 → New → Blueprint → 이 저장소를 고르면 꼬리별 추모관 서버가 만들어져요.
services:
  - type: web
    name: kkoribyeol
    runtime: node
    rootDir: petspace
    plan: free            # 출시 날에는 starter 이상을 권해요 (free는 15분 동안 손님이 없으면 잠들어요)
    region: singapore     # 한국에서 가장 가까운 Render 지역
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeploy: true
    # 올린 사진과 추모 카드를 서버를 다시 켜도 남기려면(유료 플랜) 아래 디스크를 켜고 DATA_DIR 을 /data 로 두세요.
    # disk:
    #   name: data
    #   mountPath: /data
    #   sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY
        value: "1"
      - key: ROOM_CAPACITY
        value: "30"
      - key: TRIBUTE_TTL_DAYS
        value: "7"
      - key: ADMIN_TOKEN
        generateValue: true
      # - key: DATA_DIR
      #   value: /data
