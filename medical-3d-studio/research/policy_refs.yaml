    area: kr_law
    title: "개인정보 보호법 제23조(민감정보의 처리 제한)"
    url: "https://www.law.go.kr/lsLawLinkInfo.do?chrClsCd=010202&lsJoLnkSeq=1000575255"
    verification: UNVERIFIED
    summary_ko: "검색 발췌 기준: 개인정보처리자는 사상·신념, 노동조합·정당 가입·탈퇴, 정치적 견해, 건강, 성생활 등에 관한 정보 등 민감정보를 처리해서는 안 되며, 예외는 정보주체에게 법정 사항을 알리고 다른 개인정보 처리 동의와 별도로 동의를 받은 경우와 법령에서 처리를 요구·허용하는 경우이다. 민감정보를 처리하는 경우 제29조에 따른 안전성 확보 조치를 해야 한다."
    implication_ko: "실제 환자의 영상·검사결과(관상동맥 조영 영상, 심전도 등)는 건강 정보에 해당할 수 있으므로, 사용 전 출처·식별 가능성·동의 범위를 확인해야 합니다. 가능하면 3D 재현 또는 식별 불가능한 자료를 쓰는 방안을 검토하고, 실제 자료 사용 시 개인정보 전문가 검토를 받으십시오."
    checklist_items:
      - "실제 환자 이미지·검사결과 사용 여부 확인 (없으면 '해당 없음' 기록)"
      - "사용 시: 이름·병원·날짜·ID 등 식별 정보가 화면·메타데이터에 남아 있지 않음"
      - "사용 시: 별도 동의 등 처리 근거 문서 보관 및 전문가 검토"
    notes: "원문 미열람. 검색 요약상 현행 조문 표기는 '법률 제21445호, 2026.3.10. 일부개정, 시행 2026.9.11.'이나 미확인 → 현행 판본 재확인 필요. 민감정보 범위는 시행령 제18조 참조(검색 요약). 관련 법령해석례(검색 색인 확인): https://www.law.go.kr/LSW/expcInfoP.do?expcSeq=328023 . 개인정보보호위원회(pipc.go.kr) 안내서는 접속 차단으로 확인 못함."
