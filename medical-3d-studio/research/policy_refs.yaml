      - "연령 제한 가능성 검토 및 결과 기록"
    notes: "원문 미열람. 관련 공식 페이지(검색 색인 확인): EDSA 평가 방식 https://support.google.com/youtube/answer/6345162?hl=en , 연령 제한 콘텐츠 https://support.google.com/youtube/answer/2802167?hl=en , 제한 모드 https://support.google.com/youtube/answer/7354993?hl=en . 검색 도구가 일부 결과의 작성 시점이 오래되었을 수 있다고 경고함."

