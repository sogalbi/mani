  - ref_id: P01
    area: youtube
    title: "Medical misinformation policy - YouTube Help"
    url: "https://support.google.com/youtube/answer/13813322?hl=en"
    verification: UNVERIFIED
    summary_ko: "검색 발췌 기준: YouTube는 특정 건강 상태·물질에 관해 현지 보건 당국(LHA) 지침과 모순되어 심각한 위해 위험이 있는 의료 허위정보를 허용하지 않으며, 예방·치료 등 범주로 나뉜다. 보건 당국 예시로 WHO 및 각국 보건 기관이 언급된다. 영상·오디오·제목·설명에 추가 맥락이 있는 경우 허용될 수 있다는 예외가 있고, 정책이 모든 LHA 지침을 포괄하지 않을 수 있다는 단서가 있다."
    implication_ko: "스텐트 등 치료 관련 설명이 국내 보건 당국·관련 학회 지침과 어긋나지 않는지 감수 의사가 확인하는 절차가 필요해 보입니다. 치료 효과를 과장하거나 '완치' 등 단정적 표현을 쓰지 않는지 점검하십시오."
    checklist_items:
      - "치료·효과 관련 주장마다 근거(국내 보건 당국/학회 지침 또는 문헌)를 대본에 기록했다"
      - "공식 지침과 다른 치료법을 권하거나 효과를 단정하는 표현이 없다"
      - "감수 의사 검토 완료 및 검토일 기록"
    notes: "원문 미열람(support.google.com 차단). 관련 공식 페이지(검색 색인 확인): Misinformation policies https://support.google.com/youtube/answer/10834785?hl=en , 블로그 'A long term vision for YouTube's medical misinformation policies' https://blog.youtube/inside-youtube/a-long-term-vision-for-medical-misinformation-policies/ . 검색 요약에 'COVID 전용 정책 폐지', '암 치료 허위정보 포함' 언급이 있었으나 원문 미확인."

  - ref_id: P02
    area: youtube
    title: "Disclosing use of GenAI content - Computer - YouTube Help"
    url: "https://support.google.com/youtube/answer/14328491?hl=en&co=GENIE.Platform%3DDesktop"
    verification: UNVERIFIED
    summary_ko: "검색 발췌 기준: 실존 인물이 하지 않은 말·행동을 한 것처럼 보이게 하거나, 실제 사건·장소 영상을 변조하거나, 실제로 일어나지 않은 사실적(realistic) 장면을 생성한 경우 공개(disclosure)가 필요하다. 명백히 비현실적인 콘텐츠, 애니메이션, 특수효과, 제작 보조 목적의 생성형 AI 사용은 공개 대상이 아니라고 안내되며, 완전 애니메이션 영상 속 AI 생성 애니메이션이 '사실적이지 않은' 예시로 제시된다. 공개는 YouTube 스튜디오 업로드 과정에서 설정하며, 지속적으로 공개하지 않으면 라벨 강제 부착, 콘텐츠 삭제, YPP 정지 등의 조치가 있을 수 있다."
    implication_ko: "Blender 3D 해부·시술 애니메이션은 '명백히 애니메이션'으로 볼 여지가 있으나, 사실적 렌더링 수준과 AI 음성 사용 방식에 따라 판단이 달라질 수 있으므로 원문 예시와 대조하십시오. 특히 AI 내레이션이 실존 인물(예: 감수 의사)의 목소리를 모사하는지 확인이 필요합니다."
    checklist_items:
      - "영상에 실사처럼 보이는 AI 생성 장면(실제 환자·병원·인물)이 있는지 확인"
      - "AI 음성이 실존 인물의 목소리를 복제·모사하지 않는지 확인 (해당 시 공개 설정 검토)"
      - "업로드 시 스튜디오의 AI/변조 콘텐츠 질문에 판단 근거를 기록하고 응답"
    notes: "원문 미열람. 검색 색인상 페이지 제목이 'Disclosing use of GenAI content'로 표시됨(과거 'altered or synthetic content' 명칭에서 변경된 것으로 보이나 원문 확인 필요). 관련: 블로그 https://blog.youtube/news-and-events/disclosing-ai-generated-content/ , 'Improving AI labels for viewers and creators' https://blog.youtube/news-and-events/improving-ai-labels-viewers-creators/ , 'How this content was made' 안내 https://support.google.com/youtube/answer/15447836?hl=en . 검색 요약에 '2026년 5월부터 미설정 시 YouTube 시스템이 사실적 AI 사용을 감지하면 자동 라벨 부착', 'Shorts는 오버레이 라벨' 언급이 있으나 원문 미확인. 건강 등 민감 주제에 대한 라벨 강화 여부도 원문에서 확인 필요."

  - ref_id: P03
