    title: "Violent or graphic content policies - YouTube Help"
    url: "https://support.google.com/youtube/answer/2802008?hl=en"
    verification: UNVERIFIED
    summary_ko: "검색 발췌 기준: 시청자에게 충격·혐오감을 주려는 의도의 의료 시술 영상, 혈액·구토물 등 체액 영상은 금지 항목에 포함된다. 교육·다큐멘터리·과학·예술(EDSA) 목적이면 일부 허용될 수 있으나, 교육적 맥락은 제목·설명만이 아니라 영상의 이미지나 오디오 안에 있어야 한다고 안내된다. 정책은 준수하지만 모든 연령에 적합하지 않은 콘텐츠는 연령 제한되며, 연령 제한 영상은 18세 미만 또는 로그아웃 사용자에게 표시되지 않는다."
    implication_ko: "시술 장면은 3D 애니메이션이라도 혈액·절개 묘사 수위에 따라 연령 제한 대상이 될 수 있습니다. 교육적 설명을 영상 안의 자막·내레이션으로 넣는지 확인하십시오."
    checklist_items:
