  - ref_id: P05
    area: youtube
    title: "YouTube channel monetization policies - YouTube Help"
    url: "https://support.google.com/youtube/answer/1311392?hl=en"
    verification: UNVERIFIED
    summary_ko: "검색 발췌 기준: 2025년 7월 '반복적 콘텐츠(repetitious content)' 정책명이 '진정성 없는 콘텐츠(inauthentic content)'로 바뀌었고, 반복적이거나 대량 생산된 콘텐츠가 포함됨을 명확히 했으며 이는 기존에도 수익 창출 불가였다고 안내된다. 템플릿으로 만든 듯하거나 같은 채널 영상을 연속 시청 시 반복적으로 느껴지는 콘텐츠, 창작자의 독창적 통찰 없이 일반 템플릿으로 대량 생산된 AI 생성 콘텐츠가 위반 예시로 언급된다. 재사용 콘텐츠(reused content) 정책은 별개로 유지된다."
    implication_ko: "300편 템플릿 제작 계획은 이 정책과 직접 맞닿아 있으므로, 편마다 고유한 의학적 설명·구성·시각 자료가 있는지 검토하는 절차가 필요해 보입니다. AI 사용 자체가 결격 사유는 아니라는 안내가 있으나 원문에서 확인하십시오."
    checklist_items:
      - "이번 편만의 고유한 설명·장면·감수 의견이 있는지 확인 (템플릿 재사용 비율 점검)"
      - "연속 5편 시청 시 반복적으로 느껴지는지 내부 시청 테스트"
      - "인트로/아웃트로·음악·내레이션 구조가 매 편 동일하지 않도록 변주"
    notes: "원문 미열람. 관련(검색 색인 확인): Shorts 수익 창출 정책 https://support.google.com/youtube/answer/12504220?hl=en , YPP 변경 안내 https://support.google.com/youtube/answer/12843009?hl=en , YPP 정지 이의제기 https://support.google.com/youtube/answer/9564590?hl=en . 검색 요약에 '2027-02-01 시행 YPP 변경(기준·활동 요건)' 언급이 있으나 원문 미확인."

