    verification: UNVERIFIED
    summary_ko: "검색 발췌 기준: 이 기준은 미국·영국·독일·브라질·인도네시아·일본·프랑스·대한민국·캐나다·멕시코 기반 의료 제공자에게 적용되며, 신청 국가/지역에서 의사·간호사·심리학자 등 보건 전문직 면허를 보유해야 한다. 조직을 대신해 신청하는 경우 신청자는 면허 보유 전문가여야 하고 조직이 게시하는 콘텐츠를 감독·검토해야 한다. 건강 정보 공유 원칙 준수, 수익 창출 정책 준수, 시청 시간 또는 Shorts 조회수 기준, 건강 정보 중심 채널, 활성 경고 없음 등의 요건이 있으며 승인 시 면허 보유 표시와 건강 출처 노출이 제공된다."
    implication_ko: "이 채널은 의료기관이 아니므로 신청 가능 여부는 감수 의사의 역할(조직 대신 신청 및 콘텐츠 감독)과 채널 요건 충족 여부를 원문으로 확인해야 합니다. 승인 전에는 YouTube 라벨이 없으므로, 영상 내 자격 표기 방식은 원문과 의료법(P08·P10)을 함께 검토하십시오."
