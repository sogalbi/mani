# 대본·자막 (Script Editor 출력). 모든 줄은 claims.yaml 의 주장 ID에 묶인다.
# 자막(captions)은 화면에 나오는 글자, narration 은 음성 원고. 두 내용이 같아야 한다(검수 체크리스트 M08).
# 시간 단위: 초. 줄 사이 빈틈·겹침이 없어야 한다(studio check 가 확인).
topic_id: T0001
script_version: v1
language: ko
duration_sec: 43
voice:
  status: ai_voice        # TODO | recorded | ai_voice
  asset_id: voice_supertonic3   # assets/registry.yaml 에 권리·조건과 함께 등록 (G2에서 확인)
  engine: supertonic-3    # 이 컴퓨터에서 합성 (python -m studio narrate)
