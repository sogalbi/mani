[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ad-clone-studio"
version = "0.1.0"
description = "Windows 광고 레퍼런스 분석·재현 스튜디오 (M0~M1: 프로젝트/분석 MVP)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "scenedetect>=0.7,<0.8",
    "opencv-python>=4.8",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.gui-scripts]
adclone = "adclone.app:main"

[project.scripts]
adclone-cli = "adclone.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# 테스트가 멈추면 120초 뒤 모든 스레드의 스택을 출력한다(원인 추적용, 테스트를 죽이지는 않음)
faulthandler_timeout = 120
