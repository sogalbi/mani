<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141518">
<title>K.ASRAI 마크 찍기</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="마크 찍기">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;600&family=Nanum+Myeongjo:wght@800&display=swap">
<style>
/* Layout: one phone-width column. Big proof-sheet preview on top, a strip of the other photos, then the mark settings; save bar pinned to the bottom. Ink black on cool paper with an indigo accent, like a magazine proof. */
:root {
  --bg: #eef0f3;
  --surface: #ffffff;
  --fg: #141518;
  --muted: #5b606d;
  --line: #d5d8df;
  --accent: #2b3f94;
  --accent-fg: #ffffff;
  --accent-soft: #e3e7f6;
  --stage: #1b1c20;
  --warn: #b3261e;
  --shadow: 0 1px 2px rgba(20, 21, 24, .06), 0 10px 28px rgba(20, 21, 24, .07);
  --f-display: "Nanum Myeongjo", "AppleMyungjo", "Batang", serif;
  --f-body: "IBM Plex Sans KR", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111317;
    --surface: #1b1e24;
    --fg: #e6e8ee;
    --muted: #9aa0ae;
    --line: #2d313a;
    --accent: #9aabff;
    --accent-fg: #0d1230;
    --accent-soft: #252c4a;
    --stage: #08090b;
    --warn: #ff8a80;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px rgba(0, 0, 0, .28);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111317;
  --surface: #1b1e24;
  --fg: #e6e8ee;
  --muted: #9aa0ae;
  --line: #2d313a;
  --accent: #9aabff;
  --accent-fg: #0d1230;
  --accent-soft: #252c4a;
  --stage: #08090b;
  --warn: #ff8a80;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px rgba(0, 0, 0, .28);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.55;
  word-break: keep-all;
  overflow-wrap: anywhere;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
.wrap {
  max-width: 560px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: max(24px, env(safe-area-inset-top, 0px));
  padding-bottom: 132px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

/* header */
.head { display: flex; flex-direction: column; gap: 4px; }
.eyebrow {
  margin: 0;
  font-family: var(--f-num);
  font-size: 12px;
  letter-spacing: .14em;
  color: var(--accent);
}
h1 {
  margin: 0;
  font-family: var(--f-display);
  font-weight: 800;
  font-size: 34px;
  line-height: 1.1;
  text-wrap: balance;
}
.lede { margin: 2px 0 0; color: var(--muted); font-size: 15px; max-width: 34em; }

/* buttons */
.btn {
  appearance: none;
  border: 0;
  border-radius: 12px;
  font: 600 16px/1 var(--f-body);
  min-height: 48px;
  padding: 0 18px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
  user-select: none;
}
.btn-primary { background: var(--accent); color: var(--accent-fg); }
.btn-ghost { background: var(--surface); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line); }
.btn-sm { min-height: 38px; padding: 0 14px; font-size: 14px; border-radius: 10px; flex: none; }
.btn:disabled { opacity: .55; cursor: default; }
.btn:focus-visible, .seg input:focus-visible + span, .grid9 input:focus-visible + span,
.switch input:focus-visible + .knob, .pick:focus-within, .thumb:focus-visible, .linkish:focus-visible,
input[type="range"]:focus-visible, .stage:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}
.file-input {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  opacity: 0;
  cursor: pointer;
  z-index: 1;
}

.pick {
  position: relative;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 16px;
  border-radius: 16px;
  border: 2px dashed var(--accent);
  background: var(--accent-soft);
  cursor: pointer;
}
.pick-icon {
  flex: none;
  width: 44px; height: 44px;
  border-radius: 12px;
  background: var(--accent);
  color: var(--accent-fg);
  display: grid; place-items: center;
}
.pick-text { display: flex; flex-direction: column; min-width: 0; }
.pick-title { font-weight: 600; font-size: 17px; }
.pick-sub { font-size: 13px; color: var(--muted); }

.paste {
  min-height: 52px;
  padding: 10px 14px;
  border-radius: 14px;
  border: 1.5px dashed var(--line);
  background: var(--surface);
  font-size: 13px;
  outline: none;
  caret-color: transparent;
  -webkit-user-select: text;
  user-select: text;
}
.paste:empty::before { content: attr(data-placeholder); white-space: pre-line; color: var(--muted); }
.paste:focus { border-color: var(--accent); }

/* stage */
.stage-wrap {
  background: var(--surface);
  border-radius: 16px;
  box-shadow: var(--shadow);
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.stage {
  position: relative;
  border-radius: 10px;
  background: var(--stage);
  display: flex;
  justify-content: center;
  overflow: hidden;
  cursor: crosshair;
  touch-action: manipulation;
}
.stage canvas { display: block; max-width: 100%; }
.tag, .count {
  position: absolute; top: 10px;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 12px; font-weight: 600;
  background: rgba(0, 0, 0, .62); color: #fff;
  pointer-events: none;
}
.tag { left: 10px; }
.count { right: 10px; font-family: var(--f-num); font-weight: 500; }
.meta { display: flex; align-items: center; gap: 10px; padding: 0 4px; }
.info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dims { font-family: var(--f-num); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip {
  align-self: flex-start;
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 600;
  padding: 3px 4px 3px 10px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent);
}
.chip button {
  appearance: none; border: 0; background: var(--surface); color: var(--accent);
  font: 600 12px/1 var(--f-body); padding: 4px 8px; border-radius: 999px; cursor: pointer;
}
.saved { font-size: 12px; font-weight: 600; color: var(--accent); }
.hint { margin: 0; font-size: 13px; color: var(--muted); padding: 0 4px; }

.strip { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 4px; scrollbar-width: thin; }
.thumb {
  flex: none;
  position: relative;
  appearance: none; border: 0; padding: 0;
  border-radius: 8px;
  background: var(--stage);
  overflow: hidden;
  cursor: pointer;
  box-shadow: inset 0 0 0 1px var(--line);
}
.thumb canvas { display: block; height: 72px; width: auto; }
.thumb[aria-current="true"] { box-shadow: 0 0 0 3px var(--accent); }
.thumb .dot {
  position: absolute; right: 4px; top: 4px;
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 0 2px #fff;
}

/* settings */
.panel {
  background: var(--surface);
  border-radius: 16px;
  box-shadow: var(--shadow);
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.panel-title { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: 20px; }
.field { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.field-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.label { font-weight: 600; font-size: 15px; }
.val { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--accent); }
.row-top { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: start; }
@media (max-width: 340px) { .row-top { grid-template-columns: 1fr; } }

/* 3×3 위치 고르기: 사진 한 장(4:5) 모양 */
.grid9 {
  width: 120px;
  aspect-ratio: 4 / 5;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 1fr);
  gap: 2px;
  padding: 4px;
  border-radius: 10px;
  background: var(--bg);
  box-shadow: inset 0 0 0 1px var(--line);
}
.grid9 label { position: relative; cursor: pointer; display: flex; }
.grid9 input { position: absolute; inset: 0; opacity: 0; margin: 0; }
.grid9 span {
  flex: 1;
  border-radius: 6px;
  display: grid; place-items: center;
}
.grid9 span::after {
  content: "";
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--line);
}
.grid9 input:checked + span { background: var(--surface); box-shadow: var(--shadow); }
.grid9 input:checked + span::after { width: 9px; height: 18px; border-radius: 2px; background: var(--fg); }
.grid9 label.other input:not(:checked) + span::after {
  width: 9px; height: 18px; border-radius: 2px;
  background: transparent;
  box-shadow: inset 0 0 0 2px var(--muted);
}
.pos-out { font-size: 13px; font-weight: 600; color: var(--muted); }
.legend { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; }
.legend i { display: inline-block; width: 7px; height: 12px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; background: var(--fg); }
.legend i.hollow { background: transparent; box-shadow: inset 0 0 0 2px var(--muted); }
.warn { color: var(--warn); font-weight: 600; }
.group-title {
  margin: 0;
  padding-top: 14px;
  border-top: 1px solid var(--line);
  font-size: 13px; font-weight: 600; letter-spacing: .04em;
  color: var(--muted);
}

.seg {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
  padding: 4px;
  border-radius: 12px;
  background: var(--bg);
  box-shadow: inset 0 0 0 1px var(--line);
}
.seg-3 { grid-template-columns: repeat(3, 1fr); }
.seg label { position: relative; cursor: pointer; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; }
.seg span {
  display: flex; align-items: center; justify-content: center;
  min-height: 40px;
  border-radius: 9px;
  font-size: 14px;
  font-weight: 600;
  color: var(--muted);
  text-align: center;
  padding: 0 6px;
  line-height: 1.2;
}
.seg input:checked + span { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }

input[type="range"] { width: 100%; height: 32px; margin: 0; accent-color: var(--accent); }

.switch { display: flex; align-items: center; gap: 12px; cursor: pointer; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.knob {
  flex: none;
  width: 48px; height: 28px;
  border-radius: 999px;
  background: var(--line);
  position: relative;
  transition: background .15s;
}
.knob::after {
  content: "";
  position: absolute;
  top: 3px; left: 3px;
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--surface);
  box-shadow: 0 1px 3px rgba(0, 0, 0, .25);
  transition: transform .15s;
}
.switch input:checked + .knob { background: var(--accent); }
.switch input:checked + .knob::after { transform: translateX(20px); }
.switch-text { display: flex; flex-direction: column; min-width: 0; }
.switch-text small { font-size: 13px; color: var(--muted); }

.panel-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; border-top: 1px solid var(--line); padding-top: 14px; }
.logo-file { position: relative; display: inline-flex; }
.linkish {
  appearance: none; border: 0; background: none; padding: 6px 2px;
  font: 600 14px/1 var(--f-body); color: var(--accent); cursor: pointer;
}

/* bottom bar */
.bar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 5;
  background: var(--surface);
  box-shadow: 0 -1px 0 var(--line), 0 -8px 24px rgba(0, 0, 0, .06);
  padding-top: 12px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bar-inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: auto 1fr; gap: 10px; }
.bar .btn { width: 100%; }

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 92px);
  transform: translate(-50%, 8px);
  max-width: calc(100% - 32px);
  width: max-content;
  padding: 10px 16px;
  border-radius: 12px;
  background: var(--fg);
  color: var(--bg);
  font-size: 14px;
  font-weight: 600;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s, transform .2s;
  z-index: 6;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) {
  .toast, .knob, .knob::after { transition: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <p class="eyebrow">K.ASRAI · THREADS</p>
    <h1>마크 찍기</h1>
    <p class="lede">사진에 K.ASRAI 마크를 잡지처럼 박아 줘요. 사진은 이 폰 안에서만 처리돼요.</p>
  </header>

  <div class="pick">
    <input class="file-input" type="file" id="file" accept="image/*" multiple aria-label="사진 고르기">
    <span class="pick-icon" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-4.5-4.5L6 21"/></svg>
    </span>
    <span class="pick-text">
      <span class="pick-title" id="pickTitle">사진 고르기</span>
      <span class="pick-sub">여러 장 고르면 같은 설정으로 한 번에 찍어요</span>
    </span>
  </div>

  <div class="paste" id="paste" contenteditable="true" role="textbox" inputmode="none" spellcheck="false"
       aria-label="사진 붙여넣기 칸"
       data-placeholder="사진 고르기가 안 열리면 여기에 붙여넣으세요&#10;사진 앱에서 '복사'한 뒤 이 칸을 길게 눌러 '붙여넣기'"></div>

  <section class="stage-wrap" aria-label="미리보기">
    <div class="stage" id="stage" tabindex="0" aria-describedby="stageHint">
      <canvas id="stageCanvas" role="img" aria-label="마크를 찍은 미리보기"></canvas>
      <span class="tag" id="sampleTag">예시</span>
      <span class="count" id="count" hidden></span>
    </div>
    <div class="meta">
      <div class="info">
        <div class="name" id="curName">예시 사진</div>
        <div class="dims" id="curDims"></div>
        <span class="chip" id="ownPos" hidden><span id="ownPosText"></span><button type="button" id="ownPosReset">되돌리기</button></span>
      </div>
      <span class="saved" id="curSaved" hidden>저장됨</span>
      <button class="btn btn-ghost btn-sm" type="button" id="removeCur" hidden>빼기</button>
      <button class="btn btn-ghost btn-sm" type="button" id="saveCur" hidden>이 사진 저장</button>
    </div>
    <p class="hint" id="stageHint">사진을 누르면 이 사진만 로고가 그 자리(9칸 중 하나)로 옮겨가요.</p>
    <div class="strip" id="strip" role="list" aria-label="고른 사진" hidden></div>
  </section>

  <section class="panel" aria-labelledby="panelTitle">
    <h2 class="panel-title" id="panelTitle">마크 설정</h2>

    <label class="switch" for="twoMarks">
      <input type="checkbox" id="twoMarks">
      <span class="knob" aria-hidden="true"></span>
      <span class="switch-text">
        <span class="label">마크 2개 찍기</span>
        <small>두 군데에 동시에 찍어요. 위치·모양·크기는 마크마다 따로 정해요</small>
      </span>
    </label>

    <div class="field" id="editField" hidden>
      <span class="label" id="editLabel">고칠 마크</span>
      <div class="seg" role="radiogroup" aria-labelledby="editLabel">
        <label><input type="radio" name="edit" id="edit-0" value="0"><span>마크 1</span></label>
        <label><input type="radio" name="edit" id="edit-1" value="1"><span>마크 2</span></label>
      </div>
    </div>

    <div class="row-top">
      <div class="field">
        <span class="label" id="posLabel">위치</span>
        <div class="grid9" role="radiogroup" aria-labelledby="posLabel">
          <label><input type="radio" name="pos" id="pos-tl" value="tl" aria-label="왼쪽 위"><span></span></label>
          <label><input type="radio" name="pos" id="pos-tc" value="tc" aria-label="가운데 위"><span></span></label>
          <label><input type="radio" name="pos" id="pos-tr" value="tr" aria-label="오른쪽 위"><span></span></label>
          <label><input type="radio" name="pos" id="pos-ml" value="ml" aria-label="왼쪽 가운데"><span></span></label>
          <label><input type="radio" name="pos" id="pos-mc" value="mc" aria-label="한가운데"><span></span></label>
          <label><input type="radio" name="pos" id="pos-mr" value="mr" aria-label="오른쪽 가운데"><span></span></label>
          <label><input type="radio" name="pos" id="pos-bl" value="bl" aria-label="왼쪽 아래"><span></span></label>
          <label><input type="radio" name="pos" id="pos-bc" value="bc" aria-label="가운데 아래"><span></span></label>
          <label><input type="radio" name="pos" id="pos-br" value="br" aria-label="오른쪽 아래"><span></span></label>
        </div>
        <span class="pos-out" id="posOut"></span>
        <span class="legend" id="posLegend" hidden><span><i></i>고치는 마크</span><span><i class="hollow"></i>다른 마크</span></span>
      </div>
      <div class="field">
        <span class="label" id="shapeLabel">로고 모양</span>
        <div class="seg" role="radiogroup" aria-labelledby="shapeLabel">
          <label><input type="radio" name="shape" id="shape-full" value="full"><span>전체</span></label>
          <label><input type="radio" name="shape" id="shape-ornament" value="ornament"><span>장식만</span></label>
          <label><input type="radio" name="shape" id="shape-textH" value="textH"><span>글자 가로</span></label>
          <label><input type="radio" name="shape" id="shape-textV" value="textV"><span>글자 세로</span></label>
          <label id="shapeCustomWrap" hidden><input type="radio" name="shape" id="shape-custom" value="custom"><span>내 로고 파일</span></label>
        </div>
      </div>
    </div>

    <p class="hint warn" id="samePos" hidden>두 마크가 같은 자리라 겹쳐요. 한쪽 위치를 바꿔 주세요.</p>

    <div class="field">
      <div class="field-top">
        <label class="label" for="size" id="sizeLabel">크기</label>
        <output class="val" id="sizeOut" for="size"></output>
      </div>
      <input type="range" id="size" min="6" max="60" step="1">
    </div>

    <p class="group-title" id="groupTitle" hidden>두 마크 공통</p>

    <div class="field">
      <div class="field-top">
        <label class="label" for="margin">가장자리 여백</label>
        <output class="val" id="marginOut" for="margin"></output>
      </div>
      <input type="range" id="margin" min="0" max="15" step="0.5">
    </div>

    <div class="field">
      <span class="label" id="colorLabel">색</span>
      <div class="seg seg-3" role="radiogroup" aria-labelledby="colorLabel">
        <label><input type="radio" name="color" id="color-auto" value="auto"><span>자동</span></label>
        <label><input type="radio" name="color" id="color-black" value="black"><span>검정</span></label>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const STORE_KEY = "kmark:v1";
  const LOGO_KEY = "kmark:logo:v1";
  const MAX_SIDE = 4096;          // 폰 브라우저 캔버스 한도(약 1,670만 화소) 안에 들게
  const INK = { black: "#121212", white: "#ffffff" };
  const POS_NAME = {
    tl: "왼쪽 위", tc: "가운데 위", tr: "오른쪽 위",
    ml: "왼쪽 가운데", mc: "한가운데", mr: "오른쪽 가운데",
    bl: "왼쪽 아래", bc: "가운데 아래", br: "오른쪽 아래",
  };
  // 로고 긴 변 = 사진 짧은 변의 몇 %
  const DEFAULT_SIZES = { full: 22, ornament: 20, textH: 28, textV: 20, custom: 22 };
  const SHAPES = ["full", "ornament", "textH", "textV", "custom"];
  const DEFAULTS = { margin: 4, color: "auto", opacity: 90, shadow: false };
  // 마크 1은 늘 켜져 있고, 마크 2는 "마크 2개 찍기"를 켤 때만 찍어요
  function defaultMarks() {
    return [
      { on: true, shape: "full", pos: "br", sizes: { ...DEFAULT_SIZES } },
      { on: false, shape: "full", pos: "tl", sizes: { ...DEFAULT_SIZES }, touched: false },
    ];
  }

  const state = {
    ...DEFAULTS,
    marks: defaultMarks(),
    edit: 0,          // 지금 고치는 마크 (0 또는 1)
    items: [],
    cur: 0,
  };

  function readMark(src, m) {
    if (!src) return;
    if (POS_NAME[src.pos]) m.pos = src.pos;
    if (SHAPES.includes(src.shape)) m.shape = src.shape;
    if (src.sizes) for (const k in DEFAULT_SIZES) if (typeof src.sizes[k] === "number") m.sizes[k] = Math.min(60, Math.max(6, src.sizes[k]));
  }
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if (s) {
      if (Array.isArray(s.marks)) {
        readMark(s.marks[0], state.marks[0]);
        readMark(s.marks[1], state.marks[1]);
        state.marks[1].on = !!(s.marks[1] && s.marks[1].on);
        state.marks[1].touched = !!(s.marks[1] && s.marks[1].touched);
      } else {
        readMark(s, state.marks[0]); // 예전 저장 형식 (마크 1개)
      }
      if (typeof s.margin === "number") state.margin = Math.min(15, Math.max(0, s.margin));
      if (["auto", "black", "white"].includes(s.color)) state.color = s.color;
      if (typeof s.opacity === "number") state.opacity = Math.min(100, Math.max(20, s.opacity));
      state.shadow = !!s.shadow;
    }
  } catch (e) {}

  function persist() {
    try {
      const { margin, color, opacity, shadow, marks } = state;
      localStorage.setItem(STORE_KEY, JSON.stringify({ margin, color, opacity, shadow, marks }));
    } catch (e) {}
  }

  const editMark = () => state.marks[state.edit];
  const activeMarks = () => (state.marks[1].on ? [0, 1] : [0]);
  function touch() { if (state.edit === 1) state.marks[1].touched = true; }
  function posOf(it, i) { return (it.pos && it.pos[i]) || state.marks[i].pos; }
  function opposite(p) {
    const o = { t: "b", m: "m", b: "t" }[p[0]] + { l: "r", c: "c", r: "l" }[p[1]];
    return o === p ? "tc" : o; // 한가운데는 가운데 위로
  }

  /* ---------- helpers ---------- */
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function canvas(w, h) {
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(w));
    c.height = Math.max(1, Math.round(h));
    return c;
  }
  let toastTimer = 0;
  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 2800);
  }
  function loadImg(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.decoding = "async";
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error("decode"));
      img.src = src;
    });
  }

  /* ---------- logo ---------- */
  const logos = {};        // shape -> Image (검은 잉크 + 투명 배경)
  const tintCache = new Map();
  const sizeCache = new Map();

  function shapeOf(m) {
    return m.shape === "custom" && !logos.custom ? "full" : m.shape;
  }
  function clearLogoCaches() { tintCache.clear(); sizeCache.clear(); }

  function tinted(shape, color) {
    const key = shape + "|" + color;
    let c = tintCache.get(key);
    if (!c) {
      const src = logos[shape];
      c = canvas(src.naturalWidth || src.width, src.naturalHeight || src.height);
      const x = c.getContext("2d");
      x.drawImage(src, 0, 0);
      x.globalCompositeOperation = "source-in";
      x.fillStyle = INK[color];
      x.fillRect(0, 0, c.width, c.height);
      tintCache.set(key, c);
    }
    return c;
  }

  // 큰 로고를 반씩 줄여 가며 목표 크기로 (한 번에 확 줄이면 선이 깨져요)
  function sizedLogo(shape, color, w, h) {
    const key = `${shape}|${color}|${w}x${h}`;
    let out = sizeCache.get(key);
    if (out) return out;
    let cur = tinted(shape, color);
    while (cur.width / 2 >= w && cur.height / 2 >= h && cur.width > 2) {
      const n = canvas(cur.width / 2, cur.height / 2);
      const nx = n.getContext("2d");
      nx.imageSmoothingQuality = "high";
      nx.drawImage(cur, 0, 0, n.width, n.height);
      cur = n;
    }
    out = canvas(w, h);
    const ox = out.getContext("2d");
    ox.imageSmoothingQuality = "high";
    ox.drawImage(cur, 0, 0, w, h);
    if (sizeCache.size > 80) sizeCache.clear();
    sizeCache.set(key, out);
    return out;
  }

  /* ---------- geometry ---------- */
  function outDims(it) {
    const k = Math.min(1, MAX_SIDE / Math.max(it.w, it.h));
    return [Math.max(1, Math.round(it.w * k)), Math.max(1, Math.round(it.h * k))];
  }

  function layout(it, W, H, i) {
    const mk = state.marks[i];
    const shape = shapeOf(mk);
    const img = logos[shape];
    const ar = (img.naturalWidth || img.width) / (img.naturalHeight || img.height);
    const s = Math.min(W, H);
    const long = s * mk.sizes[shape] / 100;
    let lw = ar >= 1 ? long : long * ar;
    let lh = ar >= 1 ? long / ar : long;
    const m = s * state.margin / 100;
    const pos = posOf(it, i);
    const row = pos[0], col = pos[1];
    const x = col === "l" ? m : col === "c" ? (W - lw) / 2 : W - m - lw;
    const y = row === "t" ? m : row === "m" ? (H - lh) / 2 : H - m - lh;
    return { shape, x, y, lw, lh, pos };
  }

  // 로고 자리 배경 밝기(0~1). 사진을 작게 줄인 밝기표로 계산해요.
  function areaLuma(it, L, W, H) {
    const g = it.luma;
    if (!g) return .5;
    const x0 = Math.max(0, Math.floor(L.x / W * g.w)), x1 = Math.min(g.w, Math.ceil((L.x + L.lw) / W * g.w));
    const y0 = Math.max(0, Math.floor(L.y / H * g.h)), y1 = Math.min(g.h, Math.ceil((L.y + L.lh) / H * g.h));
    let sum = 0, n = 0;
    for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) { sum += g.data[y * g.w + x]; n++; }
    return n ? sum / n : .5;
  }
  // 미리보기용 작은 사본 (긴 변 1400px). 저장할 때만 원본을 써요.
  function viewCopy(src, w, h) {
    const k = Math.min(1, 1400 / Math.max(w, h));
    if (k === 1) return src;
    const c = canvas(w * k, h * k);
    const x = c.getContext("2d");
    x.imageSmoothingQuality = "high";
    x.drawImage(src, 0, 0, c.width, c.height);
    return c;
  }
  function lumaGrid(src, w, h) {
    const gw = 64, gh = Math.max(1, Math.round(64 * h / w));
    const c = canvas(gw, gh);
    const x = c.getContext("2d", { willReadFrequently: true });
    x.drawImage(src, 0, 0, c.width, c.height);
    const d = x.getImageData(0, 0, c.width, c.height).data;
    const data = new Float32Array(c.width * c.height);
    for (let i = 0; i < data.length; i++) {
      data[i] = (.2126 * d[i * 4] + .7152 * d[i * 4 + 1] + .0722 * d[i * 4 + 2]) / 255;
    }
    return { w: c.width, h: c.height, data };
  }

  function inkColor(it, L, W, H) {
    if (state.color !== "auto") return state.color;
    return areaLuma(it, L, W, H) > .6 ? "black" : "white";
  }

  /* ---------- drawing ---------- */
  function compose(ctx, it, W, H, full) {
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(full ? it.src : (it.view || it.src), 0, 0, W, H);
    const drawn = [];
    for (const i of activeMarks()) {
      if (!logos[shapeOf(state.marks[i])]) continue;
      const L = layout(it, W, H, i);
      const color = inkColor(it, L, W, H);
      const lw = Math.max(1, Math.round(L.lw)), lh = Math.max(1, Math.round(L.lh));
      const mark = sizedLogo(L.shape, color, lw, lh);
      ctx.save();
      ctx.globalAlpha = state.opacity / 100;
      if (state.shadow) {
        const s = Math.min(W, H);
        ctx.shadowColor = color === "white" ? "rgba(0,0,0,.5)" : "rgba(255,255,255,.55)";
        ctx.shadowBlur = Math.max(1, s * .012);
        ctx.shadowOffsetY = s * .002;
      }
      ctx.drawImage(mark, Math.round(L.x), Math.round(L.y));
      ctx.restore();
      drawn.push({ i, L, color });
    }
    return drawn;
  }

  function currentItem() { return state.items[state.cur] || state.items[0]; }

  function drawStage() {
    const it = currentItem();
    const c = $("stageCanvas");
    if (!it) return;
    const boxW = $("stage").clientWidth || 320;
    const maxH = Math.max(260, Math.round(window.innerHeight * .6));
    let w = boxW, h = w * it.h / it.w;
    if (h > maxH) { h = maxH; w = h * it.w / it.h; }
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const cw = Math.max(1, Math.round(w * dpr)), ch = Math.max(1, Math.round(h * dpr));
    if (c.width !== cw) c.width = cw;
    if (c.height !== ch) c.height = ch;
    c.style.width = Math.round(w) + "px";
    c.style.height = Math.round(h) + "px";
    const drawn = compose(c.getContext("2d"), it, cw, ch);
    c.setAttribute("aria-label", `${it.name} 미리보기, ` +
      drawn.map((d) => `${POS_NAME[d.L.pos]}에 ${d.color === "white" ? "흰색" : "검정"} 마크`).join(", "));
  }

  function drawThumb(it) {
    const c = it.thumb;
    if (!c || !c.isConnected) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const h = 72, w = Math.round(h * it.w / it.h);
    c.width = Math.round(w * dpr);
    c.height = Math.round(h * dpr);
    c.style.width = w + "px";
    c.style.height = h + "px";
    compose(c.getContext("2d"), it, c.width, c.height);
  }

  function updateMeta() {
    const it = currentItem();
    if (!it) return;
    const user = state.items.filter((i) => !i.sample);
    $("sampleTag").hidden = !it.sample;
    $("count").hidden = user.length < 2;
    $("count").textContent = `${state.cur + 1} / ${user.length}`;
    $("curName").textContent = it.name;
    const [W, H] = outDims(it);
    $("curDims").textContent = it.sample ? "위에서 내 사진을 고르면 바뀌어요" : (W === it.w ? `${it.w}×${it.h}` : `${it.w}×${it.h} → ${W}×${H}`);
    const two = state.marks[1].on;
    const own = activeMarks().filter((i) => it.pos && it.pos[i]);
    $("ownPos").hidden = !own.length;
    $("ownPosText").textContent = own.length
      ? "이 사진만 " + own.map((i) => (two ? `마크 ${i + 1} ` : "") + POS_NAME[it.pos[i]]).join(" · ")
      : "";
    $("stageHint").textContent = two
      ? `사진을 누르면 이 사진만 ${state.edit ? "마크 2가" : "마크 1이"} 그 자리로 옮겨가요. 어느 마크를 옮길지는 아래 "고칠 마크"에서 골라요.`
      : "사진을 누르면 이 사진만 로고가 그 자리(9칸 중 하나)로 옮겨가요.";
    $("saveCur").hidden = !!it.sample || user.length < 2;
    $("removeCur").hidden = !!it.sample || user.length < 2;
    $("curSaved").hidden = !it.savedKey || it.savedKey !== blobKey(it);

    const strip = $("strip");
    strip.hidden = user.length < 2;
    for (const [i, x] of state.items.entries()) {
      if (!x.thumbBtn) continue;
      x.thumbBtn.setAttribute("aria-current", i === state.cur ? "true" : "false");
      x.thumbDot.hidden = !activeMarks().some((i) => x.pos && x.pos[i]);
    }
  }

  function updateControls() {
    const two = state.marks[1].on;
    if (!two) state.edit = 0;
    const mk = editMark();
    const shape = shapeOf(mk);
    const name = two ? `마크 ${state.edit + 1} ` : "";
    $("twoMarks").checked = two;
    $("editField").hidden = !two;
    $("edit-" + state.edit).checked = true;
    $("pos-" + mk.pos).checked = true;
    const other = two ? state.marks[1 - state.edit].pos : null;
    for (const k in POS_NAME) $("pos-" + k).parentElement.classList.toggle("other", k === other);
    $("posLabel").textContent = two ? name + "위치" : "위치";
    $("shapeLabel").textContent = two ? name + "모양" : "로고 모양";
    $("sizeLabel").textContent = name + "크기";
    $("posOut").textContent = POS_NAME[mk.pos];
    $("posLegend").hidden = !two;
    $("samePos").hidden = !(two && state.marks[0].pos === state.marks[1].pos);
    $("groupTitle").hidden = !two;
    $("shape-" + shape).checked = true;
    $("shapeCustomWrap").hidden = !logos.custom;
    $("logoClear").hidden = !logos.custom;
    $("logoFileText").textContent = logos.custom ? "로고 파일 다시 고르기" : "고화질 로고 파일로 바꾸기";
    $("size").value = String(mk.sizes[shape]);
    $("sizeOut").textContent = `짧은 변의 ${mk.sizes[shape]}%`;
    $("margin").value = String(state.margin);
    $("marginOut").textContent = `${state.margin}%`;
    $("color-" + state.color).checked = true;
    $("opacity").value = String(state.opacity);
    $("opacityOut").textContent = `${state.opacity}%`;
    $("shadow").checked = state.shadow;

    const user = state.items.filter((i) => !i.sample);
    $("bar").hidden = user.length === 0;
    $("saveAll").textContent = user.length > 1 ? `모두 저장 · ${user.length}장` : "저장";
    $("pickTitle").textContent = user.length ? "다른 사진 고르기" : "사진 고르기";
  }

  let rafId = 0, pendingThumbs = false;
  function refresh(thumbs = true) {
    pendingThumbs = pendingThumbs || thumbs;
    cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(() => {
      drawStage();
      if (pendingThumbs) for (const it of state.items) drawThumb(it);
      pendingThumbs = false;
      updateMeta();
      updateControls();
      scheduleEncode();
    });
  }

  function renderStrip() {
    const strip = $("strip");
    strip.replaceChildren();
    for (const [i, it] of state.items.entries()) {
      if (it.sample) continue;
      const b = el("button", "thumb");
      b.type = "button";
      b.setAttribute("role", "listitem");
      b.setAttribute("aria-label", `${i + 1}번째 사진 보기`);
      const c = document.createElement("canvas");
      const dot = el("span", "dot");
      dot.hidden = true;
      b.append(c, dot);
      b.addEventListener("click", () => { state.cur = i; refresh(false); });
      strip.append(b);
      it.thumb = c;
      it.thumbBtn = b;
      it.thumbDot = dot;
    }
    refresh();
  }

  /* ---------- stage tap: 이 사진만 위치 바꾸기 ---------- */
  $("stage").addEventListener("click", (e) => {
    const it = currentItem();
    if (!it) return;
    const r = $("stageCanvas").getBoundingClientRect();
    const fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
    if (fx < 0 || fx > 1 || fy < 0 || fy > 1) return;
    const row = fy < 1 / 3 ? "t" : fy < 2 / 3 ? "m" : "b";
    const col = fx < 1 / 3 ? "l" : fx < 2 / 3 ? "c" : "r";
    const pos = row + col;
    const i = state.edit;
    if (!it.pos) it.pos = [null, null];
    it.pos[i] = pos === state.marks[i].pos ? null : pos;
    refresh();
  });
  $("ownPosReset").addEventListener("click", () => {
    const it = currentItem();
    if (it) { it.pos = [null, null]; refresh(); }
  });

  /* ---------- sample (예시) ---------- */
  function makeSample() {
    const W = 1080, H = 1350;
    const c = canvas(W, H);
    const x = c.getContext("2d");
    const bg = x.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, "#d9d4cc");
    bg.addColorStop(.55, "#b9b0a4");
    bg.addColorStop(1, "#4b4a52");
    x.fillStyle = bg;
    x.fillRect(0, 0, W, H);
    // 비단 주름
    for (let i = 0; i < 26; i++) {
      x.beginPath();
      for (let px = -20; px <= W + 20; px += 18) {
        const yy = 560 + i * 34 + Math.sin(px / 140 + i * .6) * (30 + i * 2) + Math.cos(px / 61 + i) * 6;
        px === -20 ? x.moveTo(px, yy) : x.lineTo(px, yy);
      }
      x.strokeStyle = i % 2 ? "rgba(255,255,255,.10)" : "rgba(30,28,40,.12)";
      x.lineWidth = 14;
      x.stroke();
    }
    // 화병
    x.fillStyle = "rgba(40,36,48,.18)";
    x.beginPath(); x.ellipse(560, 900, 190, 34, 0, 0, Math.PI * 2); x.fill();
    const vase = x.createLinearGradient(380, 0, 700, 0);
    vase.addColorStop(0, "#efe9df");
    vase.addColorStop(.6, "#fbf8f2");
    vase.addColorStop(1, "#cfc6b8");
    x.fillStyle = vase;
    x.beginPath();
    x.moveTo(500, 330);
    x.bezierCurveTo(500, 420, 380, 470, 380, 650);
    x.bezierCurveTo(380, 820, 450, 900, 540, 900);
    x.bezierCurveTo(630, 900, 700, 820, 700, 650);
    x.bezierCurveTo(700, 470, 580, 420, 580, 330);
    x.closePath();
    x.fill();
    x.fillStyle = "#e4ddd1";
    x.beginPath(); x.ellipse(540, 330, 46, 12, 0, 0, Math.PI * 2); x.fill();
    // 가지
    x.strokeStyle = "#4a3b30";
    x.lineWidth = 6;
    x.lineCap = "round";
    x.beginPath(); x.moveTo(540, 330); x.quadraticCurveTo(470, 200, 360, 130); x.stroke();
    x.beginPath(); x.moveTo(540, 330); x.quadraticCurveTo(620, 230, 760, 190); x.stroke();
    x.fillStyle = "#b5323a";
    for (const [px, py, r] of [[360, 130, 22], [420, 175, 16], [760, 190, 20], [690, 205, 14], [470, 225, 12]]) {
      x.beginPath(); x.arc(px, py, r, 0, Math.PI * 2); x.fill();
    }
    return { id: "sample", name: "예시 사진", type: "image/jpeg", src: c, w: W, h: H, sample: true, luma: lumaGrid(c, W, H), pos: [null, null] };
  }

  /* ---------- export ---------- */
  function outName(it) {
    const base = (it.name || "photo").replace(/\.[^.]+$/, "") || "photo";
    return `${base}_kasrai.${it.type === "image/png" ? "png" : "jpg"}`;
  }

  function blobKey(it) {
    const { margin, color, opacity, shadow } = state;
    const parts = [margin, color, opacity, shadow ? 1 : 0, logos.customId || ""];
    for (const i of activeMarks()) {
      const mk = state.marks[i], s = shapeOf(mk);
      parts.push(i, s, mk.sizes[s], posOf(it, i));
    }
    return parts.join("|");
  }

  async function makeBlob(it) {
    const key = blobKey(it);
    if (it.blob && it.blobKey === key) return it.blob;
    const [W, H] = outDims(it);
    const c = canvas(W, H);
    compose(c.getContext("2d"), it, W, H, true);
    const type = it.type === "image/png" ? "image/png" : "image/jpeg";
    const blob = await new Promise((res, rej) => c.toBlob((b) => (b ? res(b) : rej(new Error("encode"))), type, .95));
    c.width = 0; c.height = 0;
    if (blobKey(it) === key) { it.blob = blob; it.blobKey = key; }
    return blob;
  }

  // 손을 멈추면 미리 만들어 둬서, 저장을 누르자마자 나가게
  let encTimer = 0, encRun = 0;
  function scheduleEncode() {
    clearTimeout(encTimer);
    encTimer = setTimeout(async () => {
      const run = ++encRun;
      for (const it of state.items) {
        if (it.sample) continue;
        if (run !== encRun) return;
        try { await makeBlob(it); } catch (e) {}
        await new Promise((r) => setTimeout(r, 0));
      }
    }, 600);
  }

  let downloadsPromise = null;
  function getDownloads() {
    if (!downloadsPromise) {
      downloadsPromise = window.claude && typeof window.claude.use === "function"
        ? Promise.resolve(window.claude.use("downloads")).catch(() => null)
        : Promise.resolve(null);
    }
    return downloadsPromise;
  }
  getDownloads();

  function markSaved(it, key) { it.savedKey = key; updateMeta(); }

  function saveErrorText(code) {
    switch (code) {
      case "rate_limited": return "저장 창이 너무 자주 열렸어요. 잠깐 뒤에 남은 사진을 저장해 주세요";
      case "too_large": return "사진이 너무 커서 저장하지 못했어요";
      case "unavailable": case "not_granted": case "capability_disabled": case "capability_removed":
        return "이 화면에서는 저장할 수 없어요. 앱을 새로 고친 뒤 다시 해 주세요";
      default: return "저장하지 못했어요. 다시 해 주세요";
    }
  }

  let saving = false;
  async function saveItems(items, button) {
    if (saving || !items.length) return;
    saving = true;
    const buttons = [button, $("saveAll")].filter(Boolean);
    const labels = buttons.map((b) => b.textContent);
    buttons.forEach((b) => { b.disabled = true; b.textContent = "준비 중…"; });
    try {
      const dl = await getDownloads();
      const jobs = [];
      for (const it of items) {
        const blob = await makeBlob(it);
        jobs.push({ it, key: blobKey(it), blob });
      }

      if (dl) {
        let done = 0;
        for (const job of jobs) {
          buttons.forEach((b) => { b.textContent = jobs.length > 1 ? `저장 중 ${done + 1}/${jobs.length}` : "저장 중…"; });
          try {
            await dl.save({ filename: outName(job.it), data: job.blob });
            markSaved(job.it, job.key);
            done++;
          } catch (e) {
            const code = e && e.code;
            if (code === "declined") { toast(done ? `${done}장 저장하고 멈췄어요` : "저장을 취소했어요"); return; }
            toast(saveErrorText(code));
            return;
          }
        }
        toast(done > 1 ? `${done}장 저장했어요` : "저장했어요");
        return;
      }

      // 폰 브라우저에서 열었을 때: 아이폰은 공유 시트 → '이미지 저장', 안드로이드는 바로 내려받기(갤러리 Download 앨범)
      const android = /Android/i.test(navigator.userAgent);
      const files = jobs.map((j) => new File([j.blob], outName(j.it), { type: j.blob.type }));
      if (!android && navigator.canShare && navigator.canShare({ files })) {
        try {
          await navigator.share({ files });
          jobs.forEach((j) => markSaved(j.it, j.key));
          return;
        } catch (e) {
          if (e && e.name === "AbortError") return;
        }
      }
      for (const [n, j] of jobs.entries()) {
        if (n) await new Promise((r) => setTimeout(r, 400));
        const url = URL.createObjectURL(j.blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = outName(j.it);
        document.body.append(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 60000);
        markSaved(j.it, j.key);
      }
      const count = jobs.length > 1 ? `${jobs.length}장 ` : "";
      toast(android ? `${count}저장했어요 · 갤러리의 Download 앨범에 있어요` : `${count}내려받았어요`);
    } catch (e) {
      toast("사진을 만들지 못했어요. 사진이 너무 크면 몇 장씩 나눠서 해 주세요");
    } finally {
      saving = false;
      buttons.forEach((b, i) => { b.disabled = false; b.textContent = labels[i]; });
      updateControls();
      updateMeta();
    }
  }

  /* ---------- loading photos ---------- */
  function loadFileImage(file) {
    const url = URL.createObjectURL(file);
    return loadImg(url).then((img) => ({ img, url }), (e) => { URL.revokeObjectURL(url); throw e; });
  }

  let pasteCount = 0;
  async function loadFiles(files, append) {
    const next = [];
    let failed = 0;
    for (const [i, f] of files.entries()) {
      try {
        const { img, url } = await loadFileImage(f);
        const w = img.naturalWidth, h = img.naturalHeight;
        let name = f.name || `사진 ${i + 1}`;
        if (append) name = `붙여넣은 사진 ${++pasteCount}`;
        next.push({ id: "f" + Date.now() + "_" + i, name, type: f.type, src: img, view: viewCopy(img, w, h), url, w, h, luma: lumaGrid(img, w, h), pos: [null, null] });
      } catch (e) {
        failed++;
      }
    }
    if (!next.length) { toast("사진을 열지 못했어요. 다른 사진으로 해 주세요"); return; }
    const kept = append ? state.items.filter((it) => !it.sample) : [];
    for (const it of state.items) if (it.url && !kept.includes(it)) URL.revokeObjectURL(it.url);
    state.items = kept.concat(next);
    state.cur = kept.length;
    encRun++;
    renderStrip();
    if (failed) toast(`${failed}장은 열지 못했어요`);
    else if (append) toast(`사진을 붙여넣었어요 · 지금 ${state.items.length}장`);
    else toast(next.length > 1 ? `${next.length}장 불러왔어요` : "사진을 불러왔어요");
  }

  $("file").addEventListener("change", (ev) => {
    const files = Array.from(ev.target.files || []);
    ev.target.value = "";
    if (files.length) loadFiles(files, false);
  });
  $("repick").addEventListener("click", () => $("file").click());

  $("removeCur").addEventListener("click", () => {
    const it = currentItem();
    if (!it || it.sample) return;
    if (it.url) URL.revokeObjectURL(it.url);
    state.items.splice(state.cur, 1);
    state.cur = Math.min(state.cur, state.items.length - 1);
    encRun++;
    renderStrip();
  });
  $("saveCur").addEventListener("click", () => {
    const it = currentItem();
    if (it && !it.sample) saveItems([it], $("saveCur"));
  });
  $("saveAll").addEventListener("click", () => saveItems(state.items.filter((i) => !i.sample), null));

  /* 붙여넣기: 사진 고르기 창이 안 열리는 화면에서도 쓸 수 있게 */
  function dataUrlToFile(src) {
    const m = /^data:(image\/[\w.+-]+);base64,(.*)$/i.exec(src);
    if (!m) return null;
    try {
      const bin = atob(m[2]);
      const u8 = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      return new File([u8], "pasted", { type: m[1] });
    } catch (e) {
      return null;
    }
  }
  const pasteBox = $("paste");
  document.addEventListener("paste", (e) => {
    const cd = e.clipboardData;
    if (!cd) return;
    const inBox = e.target instanceof Node && pasteBox.contains(e.target);
    let files = Array.from(cd.files || []).filter((f) => f.type.startsWith("image/"));
    if (!files.length) {
      for (const item of Array.from(cd.items || [])) {
        if (item.kind === "file" && item.type.startsWith("image/")) {
          const f = item.getAsFile();
          if (f) files.push(f);
        }
      }
    }
    if (!files.length) {
      const html = cd.getData("text/html") || "";
      for (const m of html.matchAll(/<img[^>]+src="(data:image\/[^"]+)"/gi)) {
        const f = dataUrlToFile(m[1]);
        if (f) files.push(f);
      }
    }
    if (files.length) {
      e.preventDefault();
      pasteBox.textContent = "";
      pasteBox.blur();
      loadFiles(files, true);
    } else if (inBox) {
      e.preventDefault();
      toast("붙여넣은 것 중에 사진이 없어요. 사진 앱에서 '복사'를 먼저 해 주세요");
    }
  });
  pasteBox.addEventListener("input", () => { pasteBox.textContent = ""; });

  /* ---------- 내 로고 파일 ---------- */
  // 투명 배경 PNG면 모양(알파)을, 아니면 어두운 부분을 로고로 써요. 색은 위 설정대로 칠해요.
  async function logoFromFile(file) {
    const { img, url } = await loadFileImage(file);
    URL.revokeObjectURL(url);
    const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = canvas(img.naturalWidth * k, img.naturalHeight * k);
    const x = c.getContext("2d", { willReadFrequently: true });
    x.drawImage(img, 0, 0, c.width, c.height);
    const id = x.getImageData(0, 0, c.width, c.height);
    const d = id.data;
    let transparent = false;
    for (let i = 3; i < d.length; i += 4) if (d[i] < 250) { transparent = true; break; }
    let minX = c.width, minY = c.height, maxX = -1, maxY = -1;
    for (let p = 0, i = 0; i < d.length; i += 4, p++) {
      const lum = (.2126 * d[i] + .7152 * d[i + 1] + .0722 * d[i + 2]) / 255;
      const a = transparent ? d[i + 3] : Math.round(Math.max(0, Math.min(1, (1 - lum - .06) / .8)) * 255);
      d[i] = d[i + 1] = d[i + 2] = 0;
      d[i + 3] = a;
      if (a > 10) {
        const px = p % c.width, py = (p / c.width) | 0;
        if (px < minX) minX = px;
        if (px > maxX) maxX = px;
        if (py < minY) minY = py;
        if (py > maxY) maxY = py;
      }
    }
    if (maxX < 0) throw new Error("empty");
    x.putImageData(id, 0, 0);
    const pad = 4;
    minX = Math.max(0, minX - pad); minY = Math.max(0, minY - pad);
    maxX = Math.min(c.width - 1, maxX + pad); maxY = Math.min(c.height - 1, maxY + pad);
    const t = canvas(maxX - minX + 1, maxY - minY + 1);
    t.getContext("2d").drawImage(c, minX, minY, t.width, t.height, 0, 0, t.width, t.height);
    return t.toDataURL("image/png");
  }

  async function useCustomLogo(dataUrl) {
    logos.custom = await loadImg(dataUrl);
    logos.customId = String(dataUrl.length) + dataUrl.slice(-24);
    clearLogoCaches();
  }

  $("logoFile").addEventListener("change", async (ev) => {
    const f = ev.target.files && ev.target.files[0];
    ev.target.value = "";
    if (!f) return;
    try {
      const url = await logoFromFile(f);
      await useCustomLogo(url);
      try { localStorage.setItem(LOGO_KEY, url); } catch (e) { toast("로고는 바꿨지만 다음에 열 때는 다시 골라야 해요"); }
      editMark().shape = "custom";
      touch();
      persist();
      refresh();
      toast("내 로고 파일로 바꿨어요");
    } catch (e) {
      toast("로고 파일을 읽지 못했어요. 배경이 투명한 PNG나 흰 배경 이미지를 골라 주세요");
    }
  });
  $("logoClear").addEventListener("click", () => {
    delete logos.custom;
    delete logos.customId;
    try { localStorage.removeItem(LOGO_KEY); } catch (e) {}
    for (const mk of state.marks) if (mk.shape === "custom") mk.shape = "full";
    clearLogoCaches();
    persist();
    refresh();
    toast("기본 K.ASRAI 로고로 돌렸어요");
  });

  /* ---------- controls ---------- */
  $("twoMarks").addEventListener("change", (e) => {
    const [m1, m2] = state.marks;
    m2.on = e.target.checked;
    if (m2.on) {
      // 처음 켤 때는 마크 1과 같은 로고를 반대쪽 모서리에
      if (!m2.touched) {
        m2.shape = m1.shape;
        m2.sizes = { ...m1.sizes };
        m2.pos = opposite(m1.pos);
      }
      state.edit = 1;
      toast(`마크 2를 ${POS_NAME[m2.pos]}에 찍었어요`);
    } else {
      state.edit = 0;
    }
    persist(); refresh();
  });
  for (const r of document.querySelectorAll('input[name="edit"]')) {
    r.addEventListener("change", (e) => { if (e.target.checked) { state.edit = Number(e.target.value); refresh(false); } });
  }
  for (const r of document.querySelectorAll('input[name="pos"]')) {
    r.addEventListener("change", (e) => {
      if (!e.target.checked) return;
      const i = state.edit;
      state.marks[i].pos = e.target.value;
      touch();
      // 전체 위치를 바꾸면, 따로 정한 사진 중 같은 자리는 다시 전체 설정을 따라요
      for (const it of state.items) if (it.pos && it.pos[i] === state.marks[i].pos) it.pos[i] = null;
      persist(); refresh();
    });
  }
  for (const r of document.querySelectorAll('input[name="shape"]')) {
    r.addEventListener("change", (e) => { if (e.target.checked) { editMark().shape = e.target.value; touch(); persist(); refresh(); } });
  }
  for (const r of document.querySelectorAll('input[name="color"]')) {
    r.addEventListener("change", (e) => { if (e.target.checked) { state.color = e.target.value; persist(); refresh(); } });
  }
  $("size").addEventListener("input", (e) => { const mk = editMark(); mk.sizes[shapeOf(mk)] = Number(e.target.value); touch(); persist(); refresh(); });
  $("margin").addEventListener("input", (e) => { state.margin = Number(e.target.value); persist(); refresh(); });
  $("opacity").addEventListener("input", (e) => { state.opacity = Number(e.target.value); persist(); refresh(); });
  $("shadow").addEventListener("change", (e) => { state.shadow = e.target.checked; persist(); refresh(); });
  $("reset").addEventListener("click", () => {
    Object.assign(state, DEFAULTS, { marks: defaultMarks(), edit: 0 });
    if (logos.custom) state.marks[0].shape = "custom";
    for (const it of state.items) it.pos = [null, null];
    persist();
    refresh();
    toast("기본값으로 돌렸어요");
  });

  /* ---------- redraw on resize ---------- */
  let lastW = 0;
  new ResizeObserver((entries) => {
    const w = Math.round(entries[0].contentRect.width);
    if (w !== lastW) { lastW = w; refresh(false); }
  }).observe($("stage"));

  /* ---------- start ---------- */
  (async () => {
    await Promise.all(Object.entries(LOGO_SRC).map(async ([k, src]) => { logos[k] = await loadImg(src); }));
    try {
      const saved = localStorage.getItem(LOGO_KEY);
      if (saved) await useCustomLogo(saved);
    } catch (e) {}
    state.items = [makeSample()];
    state.cur = 0;
    renderStrip();
  })();
})();
</script>
</body>
</html>
